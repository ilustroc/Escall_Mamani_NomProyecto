<p class="eyebrow">DISPONIBILIDAD DEL SERVICIO</p>
<h1>Estado de conexión</h1>
<p class="lead">Comprueba la comunicación con el servidor antes de comenzar.</p>

<section class="panel connection">
  <div class="connection-icon" aria-hidden="true">↗</div>
  <h2>Conexión con Spring Boot</h2>

  @if (isLoading()) {
    <p role="status">Comprobando conexión…</p>
  }
  @if (statusMessage()) {
    <p class="success" role="status">{{ statusMessage() }}</p>
  }
  @if (errorMessage()) {
    <p class="error" role="alert">{{ errorMessage() }}</p>
  }

  <button (click)="checkConnection()" [disabled]="isLoading()">
    Comprobar nuevamente
  </button>
</section>
