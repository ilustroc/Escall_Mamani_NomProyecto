spring.application.name=crm-cobranzas
spring.config.import=optional:file:.env[.properties]

spring.profiles.default=mysql

server.port=${PORT:8080}
server.error.include-message=never

spring.jpa.open-in-view=false

spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secreto=${JWT_SECRETO:cambia-este-secreto-por-uno-largo-y-aleatorio-123456}
app.jwt.horas-expiracion=${JWT_HORAS:8}

app.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://127.0.0.1:4200}

app.admin.usuario=${ADMIN_USUARIO:admin}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

app.datos-demo=${DATOS_DEMO:true}

app.zona-horaria=${ZONA_HORARIA:America/Lima}

management.endpoints.web.exposure.include=health
